# render.yaml — Infrastructure as Code for CareerNest
# Deploy both backend and frontend from one repo

databases:
  - name: careernest-db
    plan: free
    databaseName: careernest_db
    user: careernest_user

services:
  # ── Backend API ──
  - type: web
    name: careernest-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn careernest.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: careernest-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Frontend Static Site ──
  - type: web
    name: careernest-frontend
    runtime: static
    rootDir: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
